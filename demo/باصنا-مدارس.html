<!doctype html>

<head>
<meta charset="utf-8">

<body>
<title>باصنا مدارس</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: control bar on top; "integrated" view = school dashboard + driver phone + parent phone side by side,
   all driven by one simulated morning. Single views show one interface full size. */
:root {
  --bg: #F3F6F4;
  --surface: #FFFFFF;
  --surface-2: #F7FAF8;
  --ink: #0F1E17;
  --ink-2: #4A5B53;
  --ink-3: #7A8A82;
  --line: #DCE5E0;
  --brand: #0E9F6E;
  --brand-ink: #065F46;
  --brand-soft: #E3F5EC;
  --amber: #B45309;
  --amber-soft: #FEF3C7;
  --red: #C81E1E;
  --red-soft: #FDE8E8;
  --blue: #0369A1;
  --blue-soft: #E0F2FE;
  --map-land: #EEF2EF;
  --map-block: #E2E8E4;
  --map-road: #FFFFFF;
  --map-road-edge: #D3DCD7;
  --shadow: 0 1px 2px rgb(15 30 23 / .05), 0 2px 8px rgb(15 30 23 / .06);
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1411; --surface: #141E1A; --surface-2: #18241F; --ink: #E7F0EB; --ink-2: #A8B8B0; --ink-3: #7D8D85;
  --line: #26352E; --brand: #2BB884; --brand-ink: #7FE0B8; --brand-soft: #143528; --amber: #F2B04D; --amber-soft: #3A2C10;
  --red: #F27474; --red-soft: #3D1717; --blue: #6CC3F0; --blue-soft: #0E2B3B; --map-land: #111A16; --map-block: #18231E;
  --map-road: #24332C; --map-road-edge: #2C3D35; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 2px 10px rgb(0 0 0 / .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #141E1A; --surface-2: #18241F; --ink: #E7F0EB; --ink-2: #A8B8B0; --ink-3: #7D8D85;
  --line: #26352E; --brand: #2BB884; --brand-ink: #7FE0B8; --brand-soft: #143528; --amber: #F2B04D; --amber-soft: #3A2C10;
  --red: #F27474; --red-soft: #3D1717; --blue: #6CC3F0; --blue-soft: #0E2B3B; --map-land: #111A16; --map-block: #18231E;
  --map-road: #24332C; --map-road-edge: #2C3D35; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 2px 10px rgb(0 0 0 / .25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55;
  font-variant-numeric: tabular-nums; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.logo svg { width: 30px; height: 30px; }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border-radius: 99px; background: var(--amber-soft); color: var(--amber); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 12px; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; color: var(--ink-2); font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.sim { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; flex-wrap: wrap; }
.clock { font-weight: 700; font-size: 18px; min-width: 64px; text-align: center; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 9px; font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(.95); }

.intro { margin: 14px 0; color: var(--ink-2); max-width: 90ch; }
.intro b { color: var(--ink); }

/* integrated layout */
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 360px 360px; align-items: start; }
@media (max-width: 1320px) { .grid { grid-template-columns: minmax(0,1fr) 360px; } .grid .slot-parent { grid-column: 2; } .grid .slot-admin { grid-row: span 2; } }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0,1fr); } .grid .slot-parent, .grid .slot-admin { grid-column: auto; grid-row: auto; } }
.single { max-width: 1200px; margin-inline: auto; }
.single.phone-only { max-width: 400px; }
.slot-label { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; margin: 0 4px 6px; display: flex; justify-content: space-between; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 15px; }
.muted { color: var(--ink-3); font-size: 12px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 16px; padding: 14px 16px; }
.kpi dt { font-size: 12px; color: var(--ink-3); }
.kpi dd { margin: 2px 0 0; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex: none; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.badge.brand { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.badge.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.badge.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.badge.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.badge .pulse { width: 6px; height: 6px; border-radius: 99px; background: currentColor; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* map */
.map { position: relative; background: var(--map-land); border-radius: 0; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .legend { position: absolute; inset-inline-start: 10px; bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; font-size: 11px; color: var(--ink-2); display: flex; gap: 10px; }
.bus-card { position: absolute; inset-inline-end: 10px; top: 10px; width: min(280px, calc(100% - 20px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; font-size: 13px; }
.bus-card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 8px 0 0; }
.bus-card dt { font-size: 11px; color: var(--ink-3); }
.bus-card dd { margin: 0; font-weight: 600; }

/* lists */
.alerts { padding: 10px; display: grid; gap: 8px; max-height: 300px; overflow-y: auto; }
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 13px; }
.alert.critical { background: var(--red-soft); border-color: transparent; color: var(--red); }
.alert.warning { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
.alert b { display: block; color: inherit; }
.alert span { color: var(--ink-2); }
.alert.critical span, .alert.warning span { color: inherit; opacity: .85; }
.ok { padding: 22px; text-align: center; color: var(--ink-3); }
.timeline { list-style: none; margin: 0; padding: 12px 16px; display: grid; gap: 10px; max-height: 320px; overflow-y: auto; }
.timeline li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: 13px; }
.timeline time { color: var(--ink-3); font-size: 12px; }
.timeline .who { color: var(--ink-3); font-size: 12px; }
.cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 700px) { .cols { grid-template-columns: minmax(0,1fr); } }
.stack { display: grid; gap: 16px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
th { text-align: start; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }

/* phones */
.phone { width: 100%; max-width: 380px; margin-inline: auto; border-radius: 34px; background: var(--ink); padding: 10px; box-shadow: 0 20px 40px -18px rgb(15 30 23 / .45); }
.screen { border-radius: 26px; overflow: hidden; background: var(--bg); height: 720px; display: flex; flex-direction: column; position: relative; }
.status-bar { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-size: 11px; font-weight: 600; background: var(--surface); }
.app-h { background: var(--surface); padding: 6px 14px 10px; border-bottom: 1px solid var(--line); }
.app-h h3 { font-size: 16px; }
.app-body { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.app-foot { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 12px 14px; display: grid; gap: 8px; }
.big { border: 0; border-radius: 16px; height: 54px; font-size: 16px; font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.big.go { background: var(--brand); color: #fff; }
.big.out { background: var(--surface); border: 2px solid var(--brand); color: var(--brand-ink); }
.big.stop { background: var(--red); color: #fff; }
.big:disabled { opacity: .45; cursor: not-allowed; }
.gps { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 6px 10px; font-size: 12px; margin-top: 8px; background: var(--brand-soft); color: var(--brand-ink); }
.gps.off { background: var(--surface-2); color: var(--ink-3); }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.counts div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: center; padding: 6px 2px; }
.counts b { display: block; font-size: 19px; }
.counts span { font-size: 11px; color: var(--ink-3); }
.stop-h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
.stu { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.stu.boarded { border-color: var(--brand); }
.av { width: 38px; height: 38px; border-radius: 99px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; font-size: 13px; flex: none; }
.stu .nm { flex: 1; min-width: 0; }
.stu .nm b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act { display: flex; gap: 5px; }
.act button { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; height: 40px; min-width: 40px; padding: 0 10px; font-size: 13px; font-weight: 600; }
.act .yes { background: var(--brand); color: #fff; border-color: transparent; }
.act .drop { background: var(--blue); color: #fff; border-color: transparent; }
.act .no { color: var(--red); }
.act button:disabled { opacity: .35; cursor: not-allowed; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; font-size: 13px; }
.note { font-size: 12px; color: var(--ink-3); text-align: center; padding: 4px; }

/* parent */
.kids { display: flex; gap: 6px; margin-top: 8px; }
.kids button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px 3px 4px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.kids button[aria-selected="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.kids .av { width: 24px; height: 24px; font-size: 10px; }
.hero { border-radius: 20px; padding: 16px; color: #fff; background: #1F3A2F; }
.hero.brand { background: linear-gradient(160deg, #0E9F6E, #087B55); }
.hero.blue { background: linear-gradient(160deg, #0B7FB8, #075E88); }
.hero.amber { background: linear-gradient(160deg, #D97706, #B45309); }
.hero.red { background: linear-gradient(160deg, #DC2626, #A51B1B); }
.hero .t { font-size: 20px; font-weight: 700; margin-top: 10px; line-height: 1.35; }
.hero .s { font-size: 13px; opacity: .9; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.card h4 { margin: 0 0 8px; font-size: 14px; }
.locked { display: flex; gap: 10px; align-items: center; border-style: dashed; }
.lock-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); flex: none; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
.facts dt { font-size: 11px; color: var(--ink-3); }
.facts dd { margin: 0; font-weight: 600; }
.eta { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-top: 1px solid var(--line); }
.eta div { padding: 8px 4px; }
.eta div + div { border-inline-start: 1px solid var(--line); }
.eta span { display: block; font-size: 11px; color: var(--ink-3); }
.notif { display: flex; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.notif:last-child { border-bottom: 0; }
.notif .dot { margin-top: 7px; background: var(--brand); }
.notif.read .dot { background: transparent; }
.notif b { display: block; font-size: 13px; }
.notif p { margin: 0; font-size: 13px; color: var(--ink-2); }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
.nav button { border: 0; background: none; padding: 9px 0 12px; font-size: 12px; color: var(--ink-3); position: relative; }
.nav button[aria-current="page"] { color: var(--brand-ink); font-weight: 700; }
.nav .count { position: absolute; top: 4px; inset-inline-end: 28%; background: var(--red); color: #fff; border-radius: 99px; font-size: 10px; font-weight: 700; padding: 0 5px; }
.chat { display: grid; gap: 8px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 16px; font-size: 13px; white-space: pre-line; }
.msg.me { background: var(--brand); color: #fff; justify-self: start; border-start-start-radius: 4px; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); justify-self: end; border-start-end-radius: 4px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 12px; }
.ask { display: flex; gap: 6px; padding: 8px 10px 12px; background: var(--surface); border-top: 1px solid var(--line); }
.ask input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; font: inherit; background: var(--surface); color: var(--ink); }
.ask button { width: 44px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-size: 16px; }

/* modal + toast */
.modal { position: absolute; inset: 0; background: rgb(10 20 15 / .45); display: grid; place-items: end center; z-index: 5; }
.sheet { background: var(--surface); width: 100%; border-radius: 22px 22px 0 0; padding: 16px; display: grid; gap: 10px; }
.sheet h4 { margin: 0; font-size: 16px; }
.sheet p { margin: 0; color: var(--ink-2); font-size: 13px; }
.warnbox { border-radius: 12px; padding: 10px 12px; font-size: 13px; background: var(--red-soft); color: var(--red); }
.warnbox.amber { background: var(--amber-soft); color: var(--amber); }
.warnbox ul { margin: 6px 0 0; padding-inline-start: 18px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; }
.opts button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.toasts { position: fixed; inset-inline: 0; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 6px; z-index: 50; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 9px 14px; font-size: 13px; box-shadow: var(--shadow); max-width: 420px; animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Map geometry (schematic of north Riyadh, SVG units)
// ---------------------------------------------------------------------------
const SCHOOL = { x: 300, y: 468, name: "مدارس الرواد الأهلية" };
const ROADS = [

  { d: "M90 200 V330", name: "", lx: 0, ly: 0 },

  { d: "M820 420 H960", name: "", lx: 0, ly: 0 },

const AREAS = [

  { x: 560, y: 170, w: 240, h: 140, name: "" },
  { x: 60, y: 350, w: 340, h: 130, name: "حي الملقا" },

  { x: 840, y: 440, w: 110, h: 150, name: "" },
  { x: 140, y: 520, w: 360, h: 80, name: "" },
];

// ---------------------------------------------------------------------------
// Demo data
// ---------------------------------------------------------------------------
function freshState() {
  return {
    t: 6 * 3600 + 12 * 60,       // simulated clock (seconds since midnight)
    speed: 3, paused: false, auto: false,
    view: "all", parentChild: "s1", parentTab: "home", driverRole: "driver",
    selectedBus: null, modal: null, chat: [], requests: [],

  s += `<g><rect x="${SCHOOL.x - 22}" y="${SCHOOL.y - 22}" width="44" height="44" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><path d="M${SCHOOL.x - 11} ${SCHOOL.y + 9} V${SCHOOL.y - 3} L${SCHOOL.x} ${SCHOOL.y - 11} L${SCHOOL.x + 11} ${SCHOOL.y - 3} V${SCHOOL.y + 9} Z" fill="var(--ink)"/><text x="${SCHOOL.x}" y="${SCHOOL.y + 42}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${SCHOOL.name}</text></g>`;
  if (dest) s += dest;
  trips.forEach((id) => {
    const t = S.trips[id]; if (!active(t)) return;
    const p = pointAt(t.path, t.dist);
    const col = t.emergency ? "#DC2626" : t.delay ? "#D97706" : "#0E9F6E";
    const sel = selected === id;
    s += `<g data-bus="${id}" style="cursor:pointer" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})">
      <circle r="${sel ? 34 : 28}" fill="${col}" opacity=".16"/>
      <g transform="rotate(${(p.h + 90).toFixed(0)})"><path d="M0 -29 L7 -20 H-7 Z" fill="${col}"/></g>
      <circle r="${sel ? 21 : 18}" fill="${col}" stroke="#fff" stroke-width="4"/>
      <path d="M-8 -6 h16 a3 3 0 0 1 3 3 v8 h-22 v-8 a3 3 0 0 1 3 -3z M-9 5 h18" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
      <rect x="-30" y="25" width="60" height="22" rx="7" fill="var(--surface)" stroke="var(--line)"/>
      <text y="41" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${t.bus}</text></g>`;
  });
  return s + `</svg>`;
}

// Parent phone
// ---------------------------------------------------------------------------
function childStatus(s) {
  const t = S.trips[s.trip]; const f = first(s.name);
  if (t.emergency && s.status === "boarded") return ["red", "تنبيه: مشكلة أثناء الرحلة", "المدرسة تتابع الوضع الآن"];
  if (s.status === "boarded") return [t.delay ? "amber" : "brand", `${f} في الباص الآن`, `صعد ${hm(s.boardedAt)}${t.delay ? ` · الرحلة متأخرة ${t.delay} دقيقة` : ""}`];
  if (s.status === "dropped") return ["blue", s.place === "school" ? `وصل ${f} إلى المدرسة بسلام` : `نزل ${f} من الباص`, hm(s.droppedAt)];
  if (s.status === "absent") return ["", `تم تسجيل ${f} غائبًا عن الرحلة الصباحية`, ""];
  if (t.status === "scheduled") return ["", `الرحلة الصباحية تبدأ ${hm(t.start)}`, `الموعد المتوقع عند ${t.stops[s.stop].name}: ${hm(t.start + t.stops[s.stop].planned * 60)}`];
  if (t.status === "completed") return ["", "انتهت الرحلة الصباحية", ""];
  return [t.delay ? "amber" : "brand", `الباص في الطريق إلى ${f}`, t.delay ? `متأخرة حوالي ${t.delay} دقيقة: ${t.delayReason}` : `الموعد المتوقع: ${hm(t.start + t.stops[s.stop].planned * 60)}`];
}
function tracking(s) {
  const t = S.trips[s.trip];
  if (!active(t)) return { ok: false, why: t.status === "completed" ? "انتهت الرحلة وتوقف التتبع." : "تظهر الخريطة عند صعود ابنك إلى الباص." };
  if (s.status !== "boarded") return { ok: false, why: s.status === "dropped" ? "انتهى التتبع بعد نزول ابنك من الباص." : s.status === "absent" ? "تم تسجيل الغياب، لذلك لا يتوفر تتبع." : "تظهر الخريطة عند صعود ابنك إلى الباص." };
  const rem = totalLen(t) - t.dist; const km = rem * KM_PER_U;
  return { ok: true, km, eta: Math.max(1, Math.ceil((rem / SPEED_U + t.dwell) / 60 * 1.1)) };
}
function parentHTML() {
  const ks = kids(); const s = ks.find((k) => k.id === S.parentChild) || ks[0];
  const t = S.trips[s.trip];
  const [tn, h1, h2] = childStatus(s);
  const tr = tracking(s);
  const my = S.notifs.filter((n) => n.parent === "p1");
  const unread = my.filter((n) => !n.read).length;
  let body = "";
  if (S.parentTab === "home") {
    const mapCard = tr.ok
      ? `<div class="card" style="padding:0;overflow:hidden"><div class="map" data-map="parent">${mapSVG({ trips: [s.trip], focusTrip: s.trip, path: true })}</div>
          <div class="eta"><div><span>الوصول المتوقع</span><b data-live="eta">~${tr.eta} د</b></div><div><span>المسافة</span><b data-live="km">${tr.km.toFixed(1)} كم</b></div><div><span>آخر تحديث</span><b>الآن</b></div></div>
          <div class="note" style="text-align:start;padding:6px 12px">متجه إلى ${SCHOOL.name}. الوقت تقديري حسب المسافة والسرعة. المسار يظهر من لحظة صعود ${first(s.name)} فقط.</div></div>`
      : `<div class="card locked"><span class="lock-ic">🔒</span><div><b>تتبع الباص</b><div class="muted" style="font-size:13px">${tr.why}</div></div></div>`;
    body = `<div class="hero ${tn}"><div style="display:flex;gap:10px;align-items:center"><span class="av" style="width:46px;height:46px;background:rgb(255 255 255 / .2);color:#fff">${initials(s.name)}</span><div><b style="font-size:16px">${s.name}</b><div class="s">${s.grade}</div></div></div><div class="t">${h1}</div>${h2 ? `<div class="s">${h2}</div>` : ""}</div>
      ${mapCard}
      <div class="card"><h4>تفاصيل الرحلة</h4><dl class="facts"><div><dt>الباص</dt><dd>${t.bus} · ${t.plate}</dd></div><div><dt>الانطلاق</dt><dd>${hm(t.start)}</dd></div><div><dt>السائق</dt><dd>${t.driver}</dd></div><div><dt>المشرفة</dt><dd>${t.supervisor}</dd></div><div><dt>نقطة الصعود</dt><dd>${t.stops[s.stop].name}</dd></div><div><dt>الموعد المتوقع</dt><dd>${hm(t.start + t.stops[s.stop].planned * 60)}</dd></div></dl>
      <div class="note" style="margin-top:8px">📞 المشرفة: <span dir="ltr">050 333 4455</span></div></div>`;
  } else if (S.parentTab === "alerts") {
    body = `<div class="card">${my.length ? my.map((n) => `<div class="notif ${n.read ? "read" : ""}"><span class="dot"></span><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:6px"><b>${n.title}</b><span class="muted">${hm(n.t)}</span></div><p>${esc(n.body)}</p></div></div>`).join("") : `<div class="ok">لا توجد إشعارات بعد. ستصلك عند بدء الرحلة وصعود ابنك ووصوله.</div>`}</div>`;
  } else {
    const chat = S.chat.length ? S.chat.map((m) => `<div class="msg ${m.me ? "me" : "bot"}">${esc(m.text)}${m.action ? `<div style="margin-top:6px"><button class="btn primary" data-a="sendreq">تأكيد وإرسال الطلب للمدرسة</button></div>` : ""}</div>`).join("")
      : `<div class="card"><b>✨ المساعد الذكي</b><div class="muted" style="font-size:13px">اسألني عن رحلة ${first(s.name)} اليوم. أجيب من بيانات النظام فقط.</div></div>`;
    body = `<div class="chat">${chat}</div><div class="sugg">${["وين الباص الآن؟", `هل ${first(s.name)} وصل المدرسة؟`, "ليش الباص متأخر؟", "متى يوصل الباص؟", "كيف أغير نقطة الصعود؟", "أبغى أتواصل مع المدرسة"].map((q) => `<button data-a="ask" data-q="${q}">${q}</button>`).join("")}</div>
      <div class="note">في النسخة الفعلية يعمل المساعد بنموذج Claude ويقرأ بيانات النظام بصلاحيات ولي الأمر فقط.</div>`;
  }
  return `<div class="phone"><div class="screen">
    <div class="status-bar"><span>${hm(S.t)}</span><span>5G ▮▮▮</span></div>
    <div class="app-h"><div style="display:flex;justify-content:space-between"><b>مدارس الرواد الأهلية</b><span class="muted">عبدالله الحربي</span></div>
      <div class="kids" role="tablist" aria-label="الأبناء">${ks.map((k) => `<button role="tab" aria-selected="${k.id === s.id}" data-a="child" data-id="${k.id}"><span class="av">${initials(k.name)}</span>${first(k.name)}</button>`).join("")}</div></div>
    <div class="app-body">${body}</div>
    ${S.parentTab === "assistant" ? `<form class="ask" data-form="ask"><input id="askq" placeholder="اكتب سؤالك…" aria-label="سؤالك" autocomplete="off"><button type="submit" aria-label="إرسال">➤</button></form>` : ""}
    <nav class="nav">${[["home", "🏠 الرئيسية"], ["alerts", "🔔 الإشعارات"], ["assistant", "✨ المساعد"]].map(([k, l]) => `<button data-a="ptab" data-id="${k}" ${S.parentTab === k ? 'aria-current="page"' : ""}>${l}${k === "alerts" && unread ? `<span class="count">${unread}</span>` : ""}</button>`).join("")}</nav>
  </div></div>`;
}

// Rule-based stand-in for the Claude assistant, answering ONLY from demo state.
function answer(q) {
  const ks = kids(); let s = ks.find((k) => q.includes(first(k.name))) || ks.find((k) => k.id === S.parentChild);
  const t = S.trips[s.trip]; const f = first(s.name); const tr = tracking(s);
  if (/وين|موقع|مكان/.test(q)) return tr.ok ? `الباص الآن على بعد ${tr.km.toFixed(1)} كم من المدرسة، والوصول المتوقع حوالي ${tr.eta} دقائق (تقديري). آخر تحديث للموقع قبل لحظات، وتقدر تتابعه على الخريطة في الرئيسية.` : `لا أستطيع عرض موقع الباص الآن. ${tr.why}`;
  if (/وصل/.test(q)) return s.status === "dropped" && s.place === "school" ? `نعم، وصل ${f} إلى المدرسة بسلام الساعة ${hm(s.droppedAt)}.` : s.status === "boarded" ? `ليس بعد. ${f} في الباص منذ ${hm(s.boardedAt)}${tr.ok ? `، والوصول المتوقع حوالي ${tr.eta} دقائق` : ""}.` : s.status === "absent" ? `تم تسجيل ${f} غائبًا عن رحلة اليوم الصباحية.` : `لم يصعد ${f} إلى الباص بعد. الرحلة ${t.status === "scheduled" ? `تبدأ ${hm(t.start)}` : "بدأت والباص في الطريق"}.`;
  if (/متأخر|تأخير|ليش/.test(q)) return t.delay ? `نعم، سجّل السائق تأخيرًا حوالي ${t.delay} دقيقة. السبب: ${t.delayReason}.` : t.status === "scheduled" && S.t > t.start ? `الرحلة لم تبدأ بعد وموعدها كان ${hm(t.start)}. لا يوجد سبب تأخير مسجل في النظام حتى الآن، وتقدر تتواصل مع المشرفة نورة الدوسري.` : `لا يوجد تأخير مسجل في النظام لرحلة ${f} اليوم.`;
  if (/متى|كم باقي|يوصل/.test(q)) return tr.ok ? `الوصول المتوقع إلى المدرسة حوالي ${tr.eta} دقائق، وهو تقدير حسب المسافة الحالية والسرعة.` : s.status === "pending" ? `الموعد المخطط للباص عند ${t.stops[s.stop].name} هو ${hm(t.start + t.stops[s.stop].planned * 60)}. سأعطيك وقتًا أدق بعد صعود ${f}.` : `لا يتوفر وقت وصول متوقع الآن. ${tr.why}`;
  if (/نقطة|أغير|اغير|تغيير/.test(q)) return { text: `تغيير نقطة الصعود يتم بموافقة الإدارة. أقدر أرسل لهم الطلب التالي:\n«طلب تغيير نقطة صعود ${f} من ${t.stops[s.stop].name} إلى موقع جديد يحدده ولي الأمر.»\nهل أرسله؟`, action: { kind: "تغيير نقطة الصعود", child: s.name } };
  if (/تواصل|اتصل|المدرسة|المشرف/.test(q)) return `تقدر تتواصل مع المشرفة نورة الدوسري على الرقم 050 333 4455، أو أرسل طلب تواصل للإدارة من قسم الطلبات وستصلك الإجابة كإشعار.`;
  return `أقدر أساعدك في: موقع الباص، هل وصل ${f} المدرسة، سبب التأخير، وقت الوصول المتوقع، تغيير نقطة الصعود، والتواصل مع المدرسة.`;
}
function ask(q) {
  q = q.trim(); if (!q) return;
  S.chat.push({ me: true, text: q });
  const a = answer(q);
  if (typeof a === "string") S.chat.push({ text: a }); else { S.chat.push({ text: a.text, action: a.action }); S.pendingAction = a.action; }
  render();
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() {
  $("#clock").textContent = hm(S.t);
  $("#tabs").innerHTML = VIEWS.map(([k, l]) => `<button role="tab" aria-selected="${S.view === k}" data-a="view" data-id="${k}">${l}</button>`).join("");
  $("#speed").innerHTML = [1, 3, 10].map((x) => `<button aria-pressed="${S.speed === x}" data-a="speed" data-v="${x}">${x}×</button>`).join("");
  $("#pause").textContent = S.paused ? "متابعة" : "إيقاف مؤقت";
  $("#auto").textContent = S.auto ? "السيناريو التلقائي يعمل" : "تشغيل السيناريو تلقائيًا";
  $("#intro").innerHTML = INTRO[S.view];
  const keepInput = document.activeElement && document.activeElement.id === "askq" ? document.activeElement.value : null;
  let html = "";
  if (S.view === "all") html = `<div class="grid"><div class="slot-admin"><div class="slot-label"><span>لوحة إدارة المدرسة</span></div>${adminHTML(false)}</div>
      <div class="slot-driver"><div class="slot-label"><span>جوال السائق</span><span>${S.trips.T1.bus}</span></div>${staffHTML("driver")}</div>
      <div class="slot-parent"><div class="slot-label"><span>جوال ولي الأمر</span><span>عبدالله الحربي</span></div>${parentHTML()}</div></div>`;
  else if (S.view === "admin") html = `<div class="single">${adminHTML(true)}</div>`;
  else if (S.view === "driver") html = `<div class="single phone-only">${staffHTML("driver")}</div>`;
  else if (S.view === "supervisor") html = `<div class="single phone-only">${staffHTML("supervisor")}</div>`;
  else html = `<div class="single phone-only">${parentHTML()}</div>`;
  const scrolls = [...document.querySelectorAll(".app-body")].map((e) => e.scrollTop);
  $("#app").innerHTML = html;
  document.querySelectorAll(".app-body").forEach((e, i) => { e.scrollTop = scrolls[i] || 0; });
  if (keepInput !== null) { const i = $("#askq"); if (i) { i.value = keepInput; i.focus(); } }
}
function live() {
  $("#clock").textContent = hm(S.t);
  document.querySelectorAll('[data-map="admin"] svg').forEach((el) => el.outerHTML = mapSVG({ trips: Object.keys(S.trips), focusTrip: S.selectedBus, path: !!S.selectedBus, stops: true, selected: S.selectedBus }));
  const k = kids().find((x) => x.id === S.parentChild);
  document.querySelectorAll('[data-map="parent"] svg').forEach((el) => el.outerHTML = mapSVG({ trips: [k.trip], focusTrip: k.trip, path: true }));
  const tr = tracking(k);
  if (tr.ok) { document.querySelectorAll('[data-live="eta"]').forEach((e) => e.textContent = `~${tr.eta} د`); document.querySelectorAll('[data-live="km"]').forEach((e) => e.textContent = `${tr.km.toFixed(1)} كم`); }
  document.querySelectorAll(".status-bar span:first-child").forEach((e) => e.textContent = hm(S.t));
  const t1 = S.trips.T1;
  if (active(t1) && !t1.arrivedAt && atSchool(t1) && !S.arrivalShown) { S.arrivalShown = true; render(); }   // enable the arrival button once
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
function roleOfEvent(el) { return el.closest(".slot-parent") ? "parent" : (S.view === "supervisor" ? "supervisor" : "driver"); }
document.addEventListener("pointerdown", (e) => { const g = e.target.closest("[data-bus]"); if (g) { S.selectedBus = g.dataset.bus; render(); } });
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a; const role = roleOfEvent(b);
  const by = role === "supervisor" ? "المشرفة" : "السائق";
  switch (a) {
    case "view": S.view = b.dataset.id; S.modal = null; break;
    case "speed": S.speed = +b.dataset.v; break;
    case "mark": mark(b.dataset.id, b.dataset.s, by); return;
    case "modal": S.modal = { kind: b.dataset.m, role }; break;
    case "close": S.modal = null; break;
    case "start": S.modal = null; startTrip("T1", by); toast("بدأت الرحلة — تم تفعيل مشاركة الموقع"); return;
    case "arrive": arrive("T1", by); toast("تم تسجيل الوصول إلى المدرسة"); return;
    case "end": endTrip("T1", b.dataset.abs === "1", by); toast("انتهت الرحلة — تم إيقاف مشاركة الموقع"); return;
    case "dmin": S.modal.min = +b.dataset.v; break;
    case "dreason": S.modal.reason = b.dataset.v; break;
    case "delay": reportDelay("T1", S.modal.min, S.modal.reason, by); toast("تم إبلاغ أولياء الأمور بالتأخير"); return;
    case "itext": S.modal.text = b.dataset.v; break;
    case "incident": reportIncident("T1", S.modal.text.includes("طارئ"), S.modal.text, by); return;
    case "note": log(S.trips.T1, "ملاحظة: ازدحام عند دوار النرجس", "المشرفة"); toast("تم حفظ الملاحظة في سجل الرحلة"); break;
    case "child": S.parentChild = b.dataset.id; break;
    case "ptab": S.parentTab = b.dataset.id; if (S.parentTab === "alerts") setTimeout(() => { S.notifs.forEach((n) => { if (n.parent === "p1") n.read = true; }); }, 1500); break;
    case "ask": ask(b.dataset.q); return;
    case "sendreq": if (S.pendingAction) { S.requests.unshift({ ...S.pendingAction, text: "طلب تغيير نقطة الصعود عبر المساعد الذكي", t: S.t }); S.chat.push({ text: "تم إرسال طلبك للمدرسة ✓ وسيظهر رد الإدارة كإشعار. (يظهر الطلب الآن في لوحة الإدارة)" }); S.chat.forEach((m) => delete m.action); S.pendingAction = null; } break;
    case "selbus": S.selectedBus = b.dataset.id; break;
    case "closecard": S.selectedBus = null; break;
  }
  render();
});
document.addEventListener("submit", (e) => { const f = e.target.closest("[data-form='ask']"); if (!f) return; e.preventDefault(); const i = $("#askq"); const q = i.value; i.value = ""; ask(q); });
$("#pause").addEventListener("click", () => { S.paused = !S.paused; render(); });
$("#auto").addEventListener("click", () => { S.auto = !S.auto; if (S.auto && S.speed < 3) S.speed = 3; if (S.auto && S.trips.T1.status === "scheduled") S.t = Math.max(S.t, S.trips.T1.start - 20); if (S.auto) toast("السيناريو التلقائي: السائق والمشرفة ينفذان الرحلة كاملة"); render(); });
$("#reset").addEventListener("click", () => { const v = S.view; S = freshState(); S.view = v; render(); toast("أُعيد بدء المحاكاة من 6:12 صباحًا"); });

render();
requestAnimationFrame((n) => { last = n; requestAnimationFrame(loop); });
</script>

</body>
